<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Folio Markdown Viewer Prototype</title>
  <!-- Three variants of a local Markdown viewer, switchable via ?variant=, in one throwaway file. -->
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color-scheme: light;
      --ink: #292925;
      --muted: #7c7a72;
      --line: rgba(52, 48, 40, 0.13);
      --accent: #d5573b;
      --accent-soft: #f7dfd7;
      --paper: #fffefa;
      --canvas: #eeeae1;
      --panel: rgba(251, 249, 244, 0.92);
      --code: #272924;
      --code-ink: #eceadf;
      --shadow: 0 28px 80px rgba(65, 55, 38, 0.15), 0 4px 18px rgba(65, 55, 38, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-width: 320px;
      background: var(--canvas);
      color: var(--ink);
      overflow-x: hidden;
    }

    button, input, textarea { font: inherit; }

    button { color: inherit; }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-root { min-height: 100vh; }

    .chrome-dots { display: flex; gap: 7px; }

    .chrome-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #d2cfc6;
    }

    .chrome-dot:nth-child(1) { background: #ff5f57; }
    .chrome-dot:nth-child(2) { background: #febc2e; }
    .chrome-dot:nth-child(3) { background: #28c840; }

    .icon-button,
    .text-button,
    .file-button {
      border: 0;
      border-radius: 10px;
      background: transparent;
      min-height: 36px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .icon-button:hover,
    .text-button:hover { background: rgba(70, 66, 58, 0.08); }

    .icon-button:active,
    .text-button:active,
    .file-button:active { transform: translateY(1px); }

    .file-button {
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 650;
    }

    .file-button:hover { background: #3d3d37; }

    .file-input { display: none; }

    .markdown {
      font-family: ui-serif, "New York", Charter, Georgia, serif;
      font-size: 17px;
      line-height: 1.72;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .markdown > :first-child { margin-top: 0; }
    .markdown > :last-child { margin-bottom: 0; }

    .markdown h1,
    .markdown h2,
    .markdown h3,
    .markdown h4 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      letter-spacing: -0.025em;
      line-height: 1.18;
      scroll-margin-top: 80px;
    }

    .markdown h1 { font-size: clamp(34px, 5vw, 52px); margin: 0 0 0.9em; }
    .markdown h2 { font-size: 26px; margin: 2.1em 0 0.7em; }
    .markdown h3 { font-size: 20px; margin: 1.7em 0 0.6em; }
    .markdown h4 { font-size: 17px; margin: 1.5em 0 0.5em; }
    .markdown p { margin: 0 0 1.2em; }
    .markdown a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .markdown strong { font-weight: 700; }
    .markdown em { color: #555248; }
    .markdown del { color: var(--muted); }

    .markdown blockquote {
      margin: 1.8em 0;
      padding: 0.3em 0 0.3em 1.25em;
      border-left: 3px solid var(--accent);
      color: #615e54;
      font-size: 1.06em;
      font-style: italic;
    }

    .markdown blockquote p:last-child { margin-bottom: 0; }

    .markdown ul,
    .markdown ol { padding-left: 1.35em; margin: 0 0 1.3em; }
    .markdown li { margin: 0.35em 0; padding-left: 0.2em; }
    .markdown li.task { list-style: none; margin-left: -1.25em; }
    .markdown li.task input { margin-right: 0.6em; accent-color: var(--accent); }

    .markdown code {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.84em;
      padding: 0.16em 0.38em;
      border-radius: 5px;
      background: #eeeae0;
      color: #a13e2a;
    }

    .markdown pre {
      position: relative;
      margin: 1.7em 0;
      padding: 20px 22px;
      overflow: auto;
      border-radius: 13px;
      background: var(--code);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.08);
    }

    .markdown pre::before {
      content: attr(data-language);
      position: absolute;
      top: 8px;
      right: 11px;
      color: #92968a;
      font: 10px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .markdown pre code {
      padding: 0;
      background: transparent;
      color: var(--code-ink);
      font-size: 13px;
      line-height: 1.65;
    }

    .markdown hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }

    .markdown table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.6em 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
    }

    .markdown th,
    .markdown td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    .markdown th { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .markdown img { max-width: 100%; border-radius: 10px; }

    .document-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .drop-active::after {
      content: "Drop your Markdown file";
      position: fixed;
      inset: 18px;
      z-index: 100;
      border: 2px dashed var(--accent);
      border-radius: 20px;
      background: rgba(255, 254, 250, 0.94);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 24px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }

    /* Variant A: library */
    .library-app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr) 210px;
      background: #e9e4da;
    }

    .library-sidebar {
      min-height: 100vh;
      padding: 18px 16px 90px;
      background: rgba(244, 241, 234, 0.88);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(20px);
    }

    .library-sidebar-header {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 730;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 27px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 6px 10px 6px 6px;
      background: var(--accent);
      color: white;
      font: 700 15px/1 Georgia, serif;
      transform: rotate(-3deg);
      box-shadow: 0 5px 14px rgba(213, 87, 59, 0.24);
    }

    .side-label {
      margin: 20px 8px 8px;
      color: #969289;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .side-item {
      width: 100%;
      border: 0;
      border-radius: 9px;
      background: transparent;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-size: 13px;
      cursor: pointer;
    }

    .side-item.active { background: rgba(213, 87, 59, 0.11); color: #a33c28; font-weight: 650; }
    .side-item:hover { background: rgba(70, 66, 58, 0.07); }
    .side-icon { width: 18px; color: var(--muted); text-align: center; }

    .recent-doc {
      margin-top: 10px;
      padding: 12px 10px;
      border-top: 1px solid var(--line);
    }

    .recent-doc strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .recent-doc span { color: var(--muted); font-size: 11px; }

    .library-main { min-width: 0; padding: 18px 30px 110px; }

    .library-toolbar {
      height: 48px;
      max-width: 800px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .crumb { min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .paper {
      max-width: 800px;
      min-height: calc(100vh - 120px);
      margin: 0 auto;
      padding: clamp(44px, 7vw, 86px) clamp(34px, 8vw, 94px);
      background: var(--paper);
      border-radius: 4px;
      box-shadow: var(--shadow);
    }

    .paper .document-meta { margin-bottom: 44px; }

    .outline-panel {
      min-height: 100vh;
      padding: 82px 24px 100px 18px;
      border-left: 1px solid var(--line);
      background: rgba(239, 235, 227, 0.58);
    }

    .outline-title { margin-bottom: 14px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

    .outline-link {
      display: block;
      width: 100%;
      border: 0;
      border-left: 2px solid transparent;
      background: transparent;
      padding: 7px 4px 7px 12px;
      color: #77736a;
      text-align: left;
      font-size: 12px;
      line-height: 1.35;
      cursor: pointer;
    }

    .outline-link.level-3 { padding-left: 24px; }
    .outline-link:hover { color: var(--ink); border-left-color: var(--accent); }

    /* Variant B: reader */
    .reader-app {
      --reader-bg: #22231f;
      --reader-ink: #e8e3d8;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      background: var(--reader-bg);
      color: var(--reader-ink);
      transition: grid-template-columns 220ms ease;
    }

    .reader-app.sidebar-collapsed { grid-template-columns: 0 minmax(0, 1fr); }

    .reader-library {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 252px;
      height: 100vh;
      overflow: hidden;
      padding: 18px 16px 90px;
      background: #191a17;
      border-right: 1px solid rgba(255,255,255,0.08);
      color: #e8e3d8;
      opacity: 1;
      transition: opacity 150ms ease, transform 220ms ease, width 220ms ease, padding 220ms ease;
    }

    .sidebar-collapsed .reader-library {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-right: 0;
      opacity: 0;
      transform: translateX(-24px);
      pointer-events: none;
    }

    .reader-library-header {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .reader-library .brand-mark { box-shadow: 0 5px 18px rgba(213, 87, 59, 0.18); }
    .reader-library .icon-button { color: #b9b5aa; }
    .reader-library .icon-button:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .reader-library .side-label { color: #74766f; }
    .reader-library .side-item { color: #aaa99f; }
    .reader-library .side-item:hover { background: rgba(255,255,255,0.06); color: #e8e3d8; }
    .reader-library .side-item.active { background: rgba(232, 142, 104, 0.12); color: #f3a17f; }
    .reader-library .side-icon { color: #74766f; }
    .reader-library .recent-doc { border-color: rgba(255,255,255,0.08); }
    .reader-library .recent-doc span { color: #777a72; }

    .reader-library-outline {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .reader-library-outline .outline-link { color: #777a72; }
    .reader-library-outline .outline-link:hover { color: #e8e3d8; border-left-color: #e88e68; }

    .reader-main {
      min-width: 0;
      padding: 0 24px 120px;
    }

    .reader-scrim {
      display: none;
      border: 0;
    }

    .reader-topbar {
      position: sticky;
      top: 0;
      z-index: 4;
      height: 66px;
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: linear-gradient(var(--reader-bg) 70%, transparent);
    }

    .reader-left-actions { justify-self: start; display: flex; align-items: center; gap: 14px; }
    .reader-menu-button {
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 9px;
      width: 36px;
      height: 32px;
      background: rgba(255,255,255,0.04);
      color: #c5c1b7;
      cursor: pointer;
    }
    .reader-menu-button:hover { background: rgba(255,255,255,0.09); color: #fff; }
    .reader-filename { color: #aaa79d; font-size: 12px; letter-spacing: 0.02em; }
    .reader-actions { justify-self: end; display: flex; align-items: center; gap: 8px; }
    .reader-actions .text-button { color: #d6d2c8; }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 8;
      height: 2px;
      width: var(--progress, 0%);
      background: #e88e68;
      transition: width 100ms linear;
    }

    .reader-document {
      max-width: 710px;
      margin: clamp(50px, 9vh, 110px) auto 0;
    }

    .reader-document .document-meta { justify-content: center; margin-bottom: 54px; color: #8f8c82; }

    .reader-document .markdown { color: var(--reader-ink); font-size: 19px; line-height: 1.82; }
    .reader-document .markdown h1 { text-align: center; color: #fffaf0; font-size: clamp(42px, 7vw, 66px); }
    .reader-document .markdown h2,
    .reader-document .markdown h3,
    .reader-document .markdown h4 { color: #f5f0e5; }
    .reader-document .markdown em { color: #c6c1b6; }
    .reader-document .markdown blockquote { color: #c8c3b8; border-left-color: #e88e68; }
    .reader-document .markdown code { background: #34362f; color: #f0a785; }
    .reader-document .markdown a { color: #ef9b78; }
    .reader-document .markdown th,
    .reader-document .markdown td,
    .reader-document .markdown hr { border-color: rgba(255,255,255,0.13); }
    .reader-document .markdown th { color: #aaa79d; }

    .reader-footer {
      max-width: 710px;
      margin: 70px auto 0;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.12);
      display: flex;
      justify-content: space-between;
      color: #8f8c82;
      font-size: 12px;
    }

    /* Variant C: studio */
    .studio-app {
      min-height: 100vh;
      background: #dcdfe2;
      padding-bottom: 88px;
    }

    .studio-titlebar {
      height: 52px;
      padding: 0 17px;
      background: rgba(247, 248, 249, 0.92);
      border-bottom: 1px solid #c8ccd0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      backdrop-filter: blur(18px);
    }

    .studio-titlebar .brand { justify-self: center; font-size: 13px; }
    .studio-titlebar .file-button { justify-self: end; min-height: 30px; }

    .studio-subbar {
      height: 42px;
      padding: 0 17px;
      background: #f4f5f6;
      border-bottom: 1px solid #c8ccd0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #666b70;
      font-size: 12px;
    }

    .studio-workspace {
      min-height: calc(100vh - 94px - 88px);
      display: grid;
      grid-template-columns: minmax(280px, 0.85fr) minmax(380px, 1.15fr) 190px;
    }

    .source-pane,
    .preview-pane,
    .inspector-pane { min-width: 0; }

    .pane-label {
      height: 34px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #d4d7da;
      color: #73777b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .source-pane { background: #202225; color: #e7e6e2; border-right: 1px solid #121315; }
    .source-pane .pane-label { border-color: #35383c; color: #93989d; }

    .source-editor {
      display: block;
      width: 100%;
      min-height: calc(100vh - 128px - 88px);
      resize: none;
      border: 0;
      outline: 0;
      padding: 24px 26px 70px;
      background: #202225;
      color: #e3e4df;
      caret-color: #e3785b;
      font: 13px/1.72 "SFMono-Regular", Consolas, monospace;
      tab-size: 2;
    }

    .preview-pane { background: #fbfaf7; border-right: 1px solid #c8ccd0; }

    .preview-scroll { padding: 44px clamp(30px, 6vw, 82px) 90px; }
    .preview-scroll .markdown { max-width: 720px; margin: 0 auto; font-size: 16px; }

    .inspector-pane { background: #eceef0; }

    .inspector-content { padding: 18px 16px; }

    .inspector-stat { margin-bottom: 22px; }
    .inspector-stat span { display: block; color: #7d8185; font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; }
    .inspector-stat strong { display: block; margin-top: 4px; font-size: 18px; font-weight: 600; }

    .structure-list { margin-top: 10px; padding-top: 14px; border-top: 1px solid #d0d3d6; }
    .structure-list button { background: transparent; border: 0; padding: 5px 0; width: 100%; color: #64686c; font-size: 11px; text-align: left; cursor: pointer; }
    .structure-list button.level-3 { padding-left: 10px; }

    /* Shared prototype switcher */
    .prototype-switcher {
      position: fixed;
      z-index: 50;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      background: rgba(24, 25, 23, 0.91);
      color: #f7f4ec;
      box-shadow: 0 12px 40px rgba(0,0,0,0.24);
      backdrop-filter: blur(18px);
    }

    .prototype-switcher button {
      border: 0;
      border-radius: 9px;
      min-width: 38px;
      min-height: 36px;
      padding: 0 12px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .prototype-switcher button:hover { background: rgba(255,255,255,0.1); }
    .variant-readout { min-width: 158px; padding: 0 10px; text-align: center; }
    .variant-readout strong { display: block; font-size: 12px; }
    .variant-readout span { display: block; margin-top: 2px; color: #aaa9a3; font-size: 10px; }

    .toast {
      position: fixed;
      z-index: 70;
      top: 18px;
      left: 50%;
      transform: translate(-50%, -14px);
      padding: 10px 14px;
      border-radius: 10px;
      background: #272824;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.24);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 980px) {
      .library-app { grid-template-columns: 220px minmax(0, 1fr); }
      .outline-panel { display: none; }
      .studio-workspace { grid-template-columns: minmax(270px, 0.8fr) minmax(360px, 1.2fr); }
      .inspector-pane { display: none; }
    }

    @media (max-width: 700px) {
      .library-app { display: block; }
      .library-sidebar { min-height: auto; padding: 14px 14px 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .library-sidebar .side-label,
      .library-sidebar .side-item,
      .library-sidebar .recent-doc { display: none; }
      .library-sidebar-header { margin: 0; }
      .library-main { padding: 10px 12px 100px; }
      .paper { min-height: 0; padding: 42px 26px 66px; border-radius: 12px; }
      .library-toolbar { padding: 0 4px; }
      .reader-app,
      .reader-app.sidebar-collapsed { display: block; }
      .reader-main { padding: 0 19px 120px; }
      .reader-library {
        position: fixed;
        width: min(280px, calc(100vw - 56px));
        box-shadow: 24px 0 70px rgba(0,0,0,0.42);
        transform: translateX(0);
      }
      .sidebar-collapsed .reader-library { transform: translateX(-105%); }
      .reader-scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 9;
        background: rgba(0,0,0,0.48);
        opacity: 1;
        transition: opacity 180ms ease;
      }
      .sidebar-collapsed .reader-scrim { opacity: 0; pointer-events: none; }
      .reader-topbar { grid-template-columns: 1fr 1fr; }
      .reader-left-actions .chrome-dots { display: none; }
      .reader-filename { display: none; }
      .studio-workspace { display: block; }
      .source-pane { display: none; }
      .preview-pane { border-right: 0; }
      .studio-subbar span:first-child { display: none; }
      .variant-readout { min-width: 132px; }
      .prototype-switcher { bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="file-input" class="file-input" type="file" accept=".md,.markdown,text/markdown,text/plain">

  <script>
    const sampleMarkdown = `# The small hours

> A quiet Markdown viewer for notes worth keeping.

Folio turns plain text into a calm reading space. Drop in a Markdown file and it renders locally in your browser. Your writing never leaves your Mac.

## A useful document

Markdown stays readable before and after rendering. That is why it works so well for project notes, essays, documentation, and the half-finished ideas living on your desktop.

### What this prototype supports

- Headings and paragraphs
- **Bold**, *italic*, ~~strikethrough~~, and [links](https://daringfireball.net/projects/markdown/)
- Ordered and unordered lists
- [x] Completed tasks
- [ ] Ideas still in progress
- Blockquotes, tables, dividers, and fenced code

| Format | Best for | Status |
| --- | --- | --- |
| Reader | Long-form reading | Ready |
| Library | Browsing a folder | Ready |
| Studio | Editing and inspecting | Ready |

## A little code

\`\`\`javascript
const note = await openMarkdown(file);
render(note, { typography: "comfortable" });
\`\`\`

The first version should feel simple. Open a file, read it, and decide which direction deserves a real build.

---

*Made as a throwaway design prototype.*`;

    const variants = {
      A: { key: "A", name: "Library", note: "Browse, outline, and read" },
      B: { key: "B", name: "Reader + Library", note: "Focused reading, library on demand" },
      C: { key: "C", name: "Studio", note: "Source and preview together" }
    };

    const state = {
      markdown: sampleMarkdown,
      fileName: "the-small-hours.md",
      variant: normalizeVariant(new URLSearchParams(location.search).get("variant")),
      modified: false,
      readerSidebarOpen: true
    };

    const app = document.getElementById("app");
    const fileInput = document.getElementById("file-input");
    const toast = document.getElementById("toast");

    function normalizeVariant(value) {
      const key = String(value || "A").toUpperCase();
      return variants[key] ? key : "A";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function inlineMarkdown(value) {
      let text = escapeHtml(value);
      const codeSpans = [];
      text = text.replace(/`([^`]+)`/g, (_, code) => {
        const token = `%%CODE${codeSpans.length}%%`;
        codeSpans.push(`<code>${code}</code>`);
        return token;
      });
      text = text
        .replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1">')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>")
        .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
        .replace(/(^|[^_])_([^_]+)_/g, "$1<em>$2</em>");
      codeSpans.forEach((code, index) => {
        text = text.replace(`%%CODE${index}%%`, code);
      });
      return text;
    }

    function renderMarkdown(source) {
      const lines = String(source).replace(/\r\n?/g, "\n").split("\n");
      const output = [];
      let paragraph = [];
      let listType = null;
      let quote = [];

      const flushParagraph = () => {
        if (!paragraph.length) return;
        output.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
        paragraph = [];
      };

      const closeList = () => {
        if (!listType) return;
        output.push(`</${listType}>`);
        listType = null;
      };

      const flushQuote = () => {
        if (!quote.length) return;
        output.push(`<blockquote><p>${inlineMarkdown(quote.join(" "))}</p></blockquote>`);
        quote = [];
      };

      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        const fence = line.match(/^```\s*([\w-]*)\s*$/);
        if (fence) {
          flushParagraph(); closeList(); flushQuote();
          const code = [];
          index += 1;
          while (index < lines.length && !/^```\s*$/.test(lines[index])) {
            code.push(lines[index]);
            index += 1;
          }
          const language = fence[1] || "code";
          output.push(`<pre data-language="${escapeHtml(language)}"><code>${escapeHtml(code.join("\n"))}</code></pre>`);
          continue;
        }

        if (!line.trim()) {
          flushParagraph(); closeList(); flushQuote();
          continue;
        }

        const heading = line.match(/^(#{1,4})\s+(.+)$/);
        if (heading) {
          flushParagraph(); closeList(); flushQuote();
          const level = heading[1].length;
          const label = heading[2].replace(/[*_`~]/g, "");
          const id = slugify(label);
          output.push(`<h${level} id="${id}">${inlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        if (/^\s*(---+|___+|\*\*\*+)\s*$/.test(line)) {
          flushParagraph(); closeList(); flushQuote();
          output.push("<hr>");
          continue;
        }

        if (/^>\s?/.test(line)) {
          flushParagraph(); closeList();
          quote.push(line.replace(/^>\s?/, ""));
          continue;
        }
        flushQuote();

        if (line.includes("|") && index + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[index + 1])) {
          flushParagraph(); closeList();
          const headers = tableCells(line);
          index += 2;
          const rows = [];
          while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
            rows.push(tableCells(lines[index]));
            index += 1;
          }
          index -= 1;
          output.push(`<table><thead><tr>${headers.map(cell => `<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${headers.map((_, cellIndex) => `<td>${inlineMarkdown(row[cellIndex] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
          continue;
        }

        const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (unordered || ordered) {
          flushParagraph();
          const desiredType = ordered ? "ol" : "ul";
          if (listType && listType !== desiredType) closeList();
          if (!listType) {
            listType = desiredType;
            output.push(`<${listType}>`);
          }
          const content = (unordered || ordered)[1];
          const task = content.match(/^\[([ xX])\]\s+(.+)$/);
          if (task) {
            output.push(`<li class="task"><input type="checkbox" disabled ${task[1].toLowerCase() === "x" ? "checked" : ""}>${inlineMarkdown(task[2])}</li>`);
          } else {
            output.push(`<li>${inlineMarkdown(content)}</li>`);
          }
          continue;
        }

        closeList();
        paragraph.push(line.trim());
      }

      flushParagraph(); closeList(); flushQuote();
      return output.join("\n");
    }

    function tableCells(line) {
      return line.trim().replace(/^\||\|$/g, "").split("|").map(cell => cell.trim());
    }

    function slugify(value) {
      return String(value).toLowerCase().trim().replace(/[^a-z0-9\s-]/g, "").replace(/\s+/g, "-").replace(/-+/g, "-") || "section";
    }

    function documentStats() {
      const plain = state.markdown.replace(/```[\s\S]*?```/g, " ").replace(/[#>*_`~|\[\]()-]/g, " ");
      const words = plain.trim() ? plain.trim().split(/\s+/).length : 0;
      const headings = [...state.markdown.matchAll(/^(#{1,4})\s+(.+)$/gm)].map(match => ({
        level: match[1].length,
        text: match[2].replace(/[*_`~]/g, ""),
        id: slugify(match[2].replace(/[*_`~]/g, ""))
      }));
      return { words, minutes: Math.max(1, Math.ceil(words / 220)), headings };
    }

    function metaHtml() {
      const stats = documentStats();
      return `<div class="document-meta"><span>${stats.words} words</span><span>${stats.minutes} min read</span><span>Rendered locally</span></div>`;
    }

    function fileButton(label = "Open Markdown") {
      return `<button class="file-button" type="button" data-open-file>${label}</button>`;
    }

    function dotsHtml() {
      return '<div class="chrome-dots" aria-hidden="true"><span class="chrome-dot"></span><span class="chrome-dot"></span><span class="chrome-dot"></span></div>';
    }

    function outlineHtml(className = "") {
      const headings = documentStats().headings;
      return headings.map(item => `<button class="outline-link level-${item.level} ${className}" type="button" data-heading="${item.id}">${escapeHtml(item.text)}</button>`).join("");
    }

    function renderLibrary() {
      return `
        <main class="library-app">
          <aside class="library-sidebar" aria-label="Document library">
            <div class="library-sidebar-header">
              <div class="brand"><span class="brand-mark">F</span><span>Folio</span></div>
              <button class="icon-button" type="button" data-open-file aria-label="Open Markdown file">＋</button>
            </div>
            <div class="side-label">Library</div>
            <button class="side-item active" type="button"><span class="side-icon">▤</span>All documents</button>
            <button class="side-item" type="button"><span class="side-icon">☆</span>Favorites</button>
            <button class="side-item" type="button"><span class="side-icon">◷</span>Recently opened</button>
            <div class="side-label">Open now</div>
            <div class="recent-doc"><strong>${escapeHtml(state.fileName)}</strong><span>Local file · ${documentStats().words} words</span></div>
          </aside>
          <section class="library-main">
            <header class="library-toolbar">
              <div class="crumb">On My Mac&nbsp; / &nbsp;${escapeHtml(state.fileName)}</div>
              ${fileButton("Open file")}
            </header>
            <article class="paper">
              ${metaHtml()}
              <div class="markdown">${renderMarkdown(state.markdown)}</div>
            </article>
          </section>
          <aside class="outline-panel" aria-label="Document outline">
            <div class="outline-title">On this page</div>
            ${outlineHtml()}
          </aside>
        </main>`;
    }

    function renderReader() {
      const sidebarOpen = state.readerSidebarOpen;
      return `
        <main class="reader-app ${sidebarOpen ? "" : "sidebar-collapsed"}">
          <div class="reading-progress" aria-hidden="true"></div>
          <aside id="reader-library" class="reader-library" aria-label="Document library" aria-hidden="${sidebarOpen ? "false" : "true"}" ${sidebarOpen ? "" : "inert"}>
            <div class="reader-library-header">
              <div class="brand"><span class="brand-mark">F</span><span>Folio</span></div>
              <button class="icon-button" type="button" data-toggle-reader-sidebar aria-label="Collapse library">×</button>
            </div>
            <div class="side-label">Library</div>
            <button class="side-item active" type="button"><span class="side-icon">▤</span>All documents</button>
            <button class="side-item" type="button"><span class="side-icon">☆</span>Favorites</button>
            <button class="side-item" type="button"><span class="side-icon">◷</span>Recently opened</button>
            <div class="side-label">Open now</div>
            <div class="recent-doc"><strong>${escapeHtml(state.fileName)}</strong><span>Local file · ${documentStats().words} words</span></div>
            <div class="reader-library-outline">
              <div class="side-label">On this page</div>
              ${outlineHtml()}
            </div>
          </aside>
          <button class="reader-scrim" type="button" data-toggle-reader-sidebar aria-label="Close library"></button>
          <section class="reader-main">
            <header class="reader-topbar">
              <div class="reader-left-actions">
                <button class="reader-menu-button" type="button" data-toggle-reader-sidebar aria-controls="reader-library" aria-expanded="${sidebarOpen}" aria-label="${sidebarOpen ? "Collapse" : "Show"} library">☰</button>
                ${dotsHtml()}
              </div>
              <div class="reader-filename">${escapeHtml(state.fileName)}</div>
              <div class="reader-actions">${fileButton("Open")}</div>
            </header>
            <article class="reader-document">
              ${metaHtml()}
              <div class="markdown">${renderMarkdown(state.markdown)}</div>
              <footer class="reader-footer"><span>End of document</span><span>${documentStats().words} words</span></footer>
            </article>
          </section>
        </main>`;
    }

    function renderStudio() {
      const stats = documentStats();
      return `
        <main class="studio-app">
          <header class="studio-titlebar">
            ${dotsHtml()}
            <div class="brand"><span class="brand-mark">F</span><span>Folio Studio</span></div>
            ${fileButton("Open")}
          </header>
          <div class="studio-subbar"><span>${escapeHtml(state.fileName)}${state.modified ? " · Edited" : ""}</span><span>Markdown preview</span></div>
          <div class="studio-workspace">
            <section class="source-pane" aria-label="Markdown source">
              <div class="pane-label"><span>Source</span><span>.md</span></div>
              <textarea id="source-editor" class="source-editor" spellcheck="false" aria-label="Markdown source editor">${escapeHtml(state.markdown)}</textarea>
            </section>
            <section class="preview-pane" aria-label="Rendered preview">
              <div class="pane-label"><span>Preview</span><span>Live</span></div>
              <div class="preview-scroll"><div class="markdown">${renderMarkdown(state.markdown)}</div></div>
            </section>
            <aside class="inspector-pane" aria-label="Document inspector">
              <div class="pane-label"><span>Inspector</span><span>⌘I</span></div>
              <div class="inspector-content">
                <div class="inspector-stat"><span>Words</span><strong>${stats.words}</strong></div>
                <div class="inspector-stat"><span>Reading time</span><strong>${stats.minutes} min</strong></div>
                <div class="inspector-stat"><span>Sections</span><strong>${stats.headings.length}</strong></div>
                <div class="structure-list">${outlineHtml("structure-link")}</div>
              </div>
            </aside>
          </div>
        </main>`;
    }

    function switcherHtml() {
      const variant = variants[state.variant];
      return `
        <nav class="prototype-switcher" aria-label="Prototype variants">
          <button type="button" data-previous aria-label="Previous variant">←</button>
          <div class="variant-readout" aria-live="polite"><strong>${variant.key} · ${variant.name}</strong><span>${variant.note}</span></div>
          <button type="button" data-next aria-label="Next variant">→</button>
        </nav>`;
    }

    function render() {
      const renderers = { A: renderLibrary, B: renderReader, C: renderStudio };
      app.innerHTML = renderers[state.variant]() + switcherHtml();
      bindInteractions();
      updateProgress();
    }

    function bindInteractions() {
      app.querySelectorAll("[data-open-file]").forEach(button => {
        button.addEventListener("click", () => fileInput.click());
      });
      app.querySelector("[data-previous]").addEventListener("click", () => cycleVariant(-1));
      app.querySelector("[data-next]").addEventListener("click", () => cycleVariant(1));
      app.querySelectorAll("[data-toggle-reader-sidebar]").forEach(button => {
        button.addEventListener("click", toggleReaderSidebar);
      });
      app.querySelectorAll("[data-heading]").forEach(button => {
        button.addEventListener("click", () => {
          const target = app.querySelector(`#${CSS.escape(button.dataset.heading)}`);
          target?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
      const editor = document.getElementById("source-editor");
      if (editor) {
        editor.addEventListener("input", event => {
          state.markdown = event.target.value;
          state.modified = true;
          const preview = app.querySelector(".preview-scroll .markdown");
          if (preview) preview.innerHTML = renderMarkdown(state.markdown);
          const stats = documentStats();
          const values = app.querySelectorAll(".inspector-stat strong");
          if (values[0]) values[0].textContent = stats.words;
          if (values[1]) values[1].textContent = `${stats.minutes} min`;
          if (values[2]) values[2].textContent = stats.headings.length;
          const fileStatus = app.querySelector(".studio-subbar span:first-child");
          if (fileStatus) fileStatus.textContent = `${state.fileName} · Edited`;
          const structure = app.querySelector(".structure-list");
          if (structure) structure.innerHTML = outlineHtml("structure-link");
        });
      }
    }

    function setVariant(key) {
      state.variant = normalizeVariant(key);
      const url = new URL(location.href);
      url.searchParams.set("variant", state.variant);
      history.replaceState(null, "", url);
      scrollTo({ top: 0, behavior: "instant" });
      render();
    }

    function cycleVariant(direction) {
      const keys = Object.keys(variants);
      const next = (keys.indexOf(state.variant) + direction + keys.length) % keys.length;
      setVariant(keys[next]);
    }

    function toggleReaderSidebar() {
      state.readerSidebarOpen = !state.readerSidebarOpen;
      const reader = app.querySelector(".reader-app");
      const library = app.querySelector(".reader-library");
      const menu = app.querySelector(".reader-menu-button");
      if (!reader || !library || !menu) return;
      reader.classList.toggle("sidebar-collapsed", !state.readerSidebarOpen);
      library.setAttribute("aria-hidden", String(!state.readerSidebarOpen));
      library.toggleAttribute("inert", !state.readerSidebarOpen);
      menu.setAttribute("aria-expanded", String(state.readerSidebarOpen));
      menu.setAttribute("aria-label", `${state.readerSidebarOpen ? "Collapse" : "Show"} library`);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function loadFile(file) {
      if (!file) return;
      const markdownFile = /\.(md|markdown)$/i.test(file.name) || ["text/markdown", "text/plain", ""].includes(file.type);
      if (!markdownFile) {
        showToast("Choose a Markdown file");
        return;
      }
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        state.markdown = String(reader.result || "");
        state.fileName = file.name;
        state.modified = false;
        render();
        showToast(`Opened ${file.name}`);
      });
      reader.addEventListener("error", () => showToast("That file could not be read"));
      reader.readAsText(file);
    }

    fileInput.addEventListener("change", event => {
      loadFile(event.target.files[0]);
      event.target.value = "";
    });

    document.addEventListener("keydown", event => {
      const target = event.target;
      const editing = target.matches("input, textarea, [contenteditable='true']");
      if (editing || event.metaKey || event.ctrlKey || event.altKey) return;
      if (event.key === "Escape" && state.variant === "B" && state.readerSidebarOpen) {
        toggleReaderSidebar();
        return;
      }
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    document.addEventListener("dragover", event => {
      event.preventDefault();
      document.body.classList.add("drop-active");
    });

    document.addEventListener("dragleave", event => {
      if (!event.relatedTarget) document.body.classList.remove("drop-active");
    });

    document.addEventListener("drop", event => {
      event.preventDefault();
      document.body.classList.remove("drop-active");
      loadFile(event.dataTransfer.files[0]);
    });

    function updateProgress() {
      const progress = app.querySelector(".reading-progress");
      if (!progress) return;
      const max = document.documentElement.scrollHeight - innerHeight;
      const percent = max > 0 ? Math.min(100, Math.max(0, scrollY / max * 100)) : 0;
      progress.style.setProperty("--progress", `${percent}%`);
    }

    addEventListener("scroll", updateProgress, { passive: true });
    addEventListener("popstate", () => {
      state.variant = normalizeVariant(new URLSearchParams(location.search).get("variant"));
      render();
    });

    render();
  </script>
</body>
</html>
